version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime-and-types:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # nexus-ai-2045 の自前 workflow（preflight-gate など）は固定先を人が上げるので、ここでは上げない。
    ignore:
      - dependency-name: "nexus-ai-2045/*"
