name: preflight

# 共通の入口（repo-preflight の preflight-gate）を SHA 固定で呼ぶ。
# 固定先: repo-preflightのbase-guard廃止後の統合済みcommit。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  # 同じPRで新しいpushが来たら古い実行を止める（古いheadの赤が残らないように）。mainのpushは止めない
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  gate:
    uses: nexus-ai-2045/repo-preflight/.github/workflows/preflight-gate.yml@a337a3c3fbeb85506cf81dc6d628d325abb86307 # base-guard廃止版
    with:
      preflight-ref: a337a3c3fbeb85506cf81dc6d628d325abb86307 # uses の @ と同じ統合済みSHA
  # 必須にするのはこの集約ジョブ。if: で飛ばしても skipped は成功にならず赤になる
  all-green:
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success
