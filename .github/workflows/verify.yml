name: 製品契約と動作検証
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: app
      # Git に置かない派生物（members.json と今の世代の catalog.sqlite3）を、リポの中のデータだけから作る
      - run: node scripts/build_public_members.mjs
      - run: python -m scripts.build_public_distribution --input-root data/distribution/sources/world-bank --case data/distribution/case-source.json --output-root data/distribution/generated --public-dir app/public/distribution
      # CSV（speeches・industry_va）に頼るテストは tests/data_gated_tests.txt の分だけ skip される。一覧に無い skip は赤
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm audit --audit-level=moderate
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
