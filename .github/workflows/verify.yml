name: 製品契約と動作検証
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # 同じPRで新しいpushが来たら古い実行を止める（古いheadの赤が残らないように）。mainのpushは止めない
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: app
      # Git に置かない派生物（members.json と今の世代の catalog.sqlite3）を、リポの中のデータだけから作る
      - run: node scripts/build_public_members.mjs
      # Git に置かない派生物（設計決定0022）：物価の換算表を固定した OECD 表6から作る
      - run: python scripts/build_price_index.py
      - run: python -m scripts.build_public_distribution --input-root data/distribution/sources/world-bank --case data/distribution/case-source.json --output-root data/distribution/generated --public-dir app/public/distribution
      # CSV（speeches・industry_va）に頼るテストは tests/data_gated_tests.txt の分だけ skip される。一覧に無い skip は赤
      # 計算式のバックテスト：毎回今のデータで測り直し、結果をログに出す（定義は docs/adr/0020）
      - run: python scripts/backtest.py
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm audit --audit-level=moderate
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
