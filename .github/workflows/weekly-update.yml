name: weekly-update

# 週2回（月曜・木曜の 3:00 JST）、一次資料の取得と再計算を回し、変化があれば PR を作る。
# 毎日更新はしない（2026-10-25 の決定）。cron は UTC：日曜・水曜 18:00 UTC = 月曜・木曜 3:00 JST。
# PR は自動で取り込まない。検査（verify・preflight）が通ってから人かレビューが取り込む。
# 守り（2026-11-19）：取得が1段でも失敗したか、振り分けが無い成立法があれば再計算へ進まず、ジョブを失敗させて PR を出さない。
#   再計算のあとも、main より大きく減ったデータがあれば PR を出さない（scripts/check_data_shrink.py）。
#   理由はジョブの Summary に出る。意図した減少を通すときだけ、手動実行で allow_shrink にチェックを入れる。
# 注意：GITHUB_TOKEN で作った PR には他のワークフローが走らない。検査は PR を開き直す（Close→Reopen）か、
#       「Update branch」で起こす。リポジトリ設定「Allow GitHub Actions to create and approve pull requests」が要る。

on:
  schedule:
    - cron: '0 18 * * 0,3'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'データが大きく減っていても PR を出す（意図した減少のときだけ）'
        type: boolean
        default: false

concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 政治資金の取得枠だけで最大40分あり、全段で90分を超える（手動実行で確認）。
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      # preflight.yml と同じ固定先（repo-preflight v0.10.0）
      PREFLIGHT_REF: 5b7c774deb8e9abcf0fce0c5f39ec1c1f3a894f3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # daily_update.py の事前チェック（個人名義）が使う repo-preflight を、固定 SHA で置く
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: ${{ env.PREFLIGHT_REF }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: app
      # 取得の段が使う道具。無いと段が失敗する：pdftotext（poppler-utils。国策の本文・数値目標の系列）、
      # openpyxl・xlrd（財務省・総務省などの Excel）。
      - name: 取得に使う道具を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -m pip install --disable-pip-version-check openpyxl==3.1.5 xlrd==2.0.1
          pdftotext -v
      # 公開用の名義を設定し、書き込みの前に identity guard の config を通す。不合格ならここで止まり、何も書かない。
      - name: 公開用の名義を設定して identity guard の config を通す
        run: |
          git config user.name "nexus_ai"
          git config user.email "273569186+nexus-ai-2045@users.noreply.github.com"
          python3 tool/scripts/local_identity_guard.py --public-name nexus-ai-2045 --public-name nexus_ai config
      # 事前チェックのフック検査を通すため、更新の前に git フックを入れる（commit・push でも共通検査が動く）。
      - name: git フックを入れる
        env:
          REPO_PREFLIGHT_HOME: ${{ github.workspace }}/tool
        run: python3 scripts/install_hooks.py
      # 取得と再計算。--strict：取得が失敗した段か、振り分けが無い成立法があれば再計算へ進まない。
      # 再計算が途中で落ちたときも含め、失敗で終わったらこの段でジョブを止め、PR を出さない（欠けたデータを差分にしない）。
      # 政治資金は飛ばす：一覧・取得の記録・原本の保管庫が Git に入らないので、ここでは毎回ゼロから全件を取り直して
      # 1段の上限（3600秒）で必ず時間切れになり、取った原本も実行の終わりに消える。原本の保管庫が残る環境で回す。
      - name: 取得と再計算
        env:
          REPO_PREFLIGHT_ROOT: ${{ github.workspace }}/tool
          REPO_PREFLIGHT_HOME: ${{ github.workspace }}/tool
        run: |
          set -uo pipefail
          mkdir -p .local/daily-update
          status=0
          python3 scripts/daily_update.py --fetch --rebuild --strict --skip political-funds \
            --report .local/daily-update/report.md 2>&1 | tee .local/daily-update/log.txt || status=$?
          if [ -f .local/daily-update/report.md ]; then
            cat .local/daily-update/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '報告を書く前に落ちた。ログの末尾：'; echo '```'; tail -n 40 .local/daily-update/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::取得か再計算が失敗で終わった（終了コード $status）。PR は出さない。段ごとの結果は Summary を見る。"
            exit "$status"
          fi
      - name: 変化があれば個人名義検査を通して PR を作る
        env:
          REPO_PREFLIGHT_HOME: ${{ github.workspace }}/tool
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data app/public)" ]; then
            echo "変化なし。PR は作らない。"
            exit 0
          fi
          # main より大きく減ったデータがあれば、ここで失敗させて PR を出さない。
          shrink=0
          python3 scripts/check_data_shrink.py --base HEAD $ALLOW_SHRINK | tee .local/daily-update/shrink.txt || shrink=$?
          { echo; echo '## データの減り方の確認'; echo; cat .local/daily-update/shrink.txt; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$shrink" -ne 0 ]; then
            echo "::error::main より大きく減ったデータがある。PR は出さない。一覧は Summary を見る。"
            exit "$shrink"
          fi
          branch="report/weekly-update-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$branch"
          python3 scripts/roadmap_check.py --update
          git add -- data app/public docs/ロードマップ.md
          git commit -m "週2回の自動更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）：取得の記録と再計算"
          # 生成した変更を含むコミットに、push 前と同じ個人名義検査を回す。不合格なら送らない。
          python3 tool/scripts/local_identity_guard.py --public-name nexus-ai-2045 --public-name nexus_ai check --range "origin/main..HEAD"
          git push origin "$branch"
          {
            echo "週2回の自動更新（月・木 3:00 JST）。取得と再計算の結果です。"
            echo
            echo "- 取得に失敗した段が無く（届かない取得先は前回のデータのまま）、再計算が通り、main より大きく減ったデータが無いときだけ、この PR を作ります。"
            echo "- 検査（verify・preflight）が通ってから取り込みます。"
            echo
            echo '```'
            cat .local/daily-update/shrink.txt
            echo '```'
            echo
            echo '```'
            tail -n 60 .local/daily-update/log.txt
            echo '```'
          } > .local/daily-update/pr-body.md
          gh pr create --draft --base main --head "$branch" \
            --title "週2回の自動更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）" \
            --body-file .local/daily-update/pr-body.md
